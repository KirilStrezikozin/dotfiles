[global/wm]
; include-file = $HOME/.config/polybar/themes/catppuccin-mocha.ini
include-file = $HOME/.config/polybar/modules.ini

[colors]
background = ${colors.base}
background-alt = ${colors.surface0}
foreground = ${colors.text}
primary = ${colors.pink}
secondary = ${colors.crust}
alert = ${colors.red}
; disabled = #707880
disabled = ${colors.subtext1}

[bar/main]
width = 100%
height = 20pt
radius = 6

; dpi = 96

bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1pt

border-size = 8pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetbrainsMono Nerd Font:size=9;2

; modules-left = xworkspaces xwindow
modules-left = menu xworkspaces xwindow
modules-center = date
modules-right = filesystem pulseaudio xkeyboard memory cpu wlan eth battery

cursor-click = pointer
cursor-scroll = ns-resize

tray-transparent = true

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

override-redirect = true

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
