set -ga terminal-overrides ",tmux-256color*:Tc"
set-option -g default-terminal "tmux-256color"
set -s escape-time 0
set -g base-index 1

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

unbind r
bind-key r source-file ~/.config/tmux/tmux.conf

unbind %
bind-key | split-window -h
unbind '"'
bind-key - split-window -v

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L

# maximize a pane
unbind m
bind-key -r m resize-pane -Z

set -g mouse on

# select text on a pane (prefix + [ to enter copy mode, <C-c> to leave)
set-window-option -g mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# theming
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# plugins
set -g @plugin 'tmux-plugins/tmux-resurrect' # save sessions
set -g @plugin 'tmux-plugins/tmux-continuum' # save sessions every 15 mins

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

set -g @continuum-restore 'on'
set -g status-right 'ss: #{continuum_status}'

# run tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'
